[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbem-pytorch"
version = "0.1.0"
description = "Conductance-based encoding model utilities in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CBEM contributors" }]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "h5py>=3.9",
]

[project.optional-dependencies]
notebook = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "ipykernel>=6.29",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["utils"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
